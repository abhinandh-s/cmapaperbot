[package]
name = "cmapaperbot"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
urlencoding = "2.1"

# `@deno/wasmbuild@0.22.0` supports `wasm-bindgen = "=0.2.108"`
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4.58"
gloo-console = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }