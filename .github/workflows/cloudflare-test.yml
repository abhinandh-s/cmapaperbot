
name: Test Cloudflare Worker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Build and validate Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install

      - name: Verify WASM files exist
        run: |
          test -f lib/cmapaperbot.js
          test -f lib/cmapaperbot.internal.js
          test -f lib/cmapaperbot.wasm

      - name: Check for the old Deno WASM wrapper
        run: |
          if grep -Eq \
            'import \* as wasm from "\./cmapaperbot\.wasm"|__wbg_set_wasm\(wasm\)|wasm\.__wbindgen_start\(\)' \
            lib/cmapaperbot.js; then
            echo "::error::The original Deno WASM initialization wrapper is still present."
            echo "Check lib/cmapaperbot.js and commit the Cloudflare-compatible version."
            exit 1
          fi

      - name: Validate Cloudflare Worker build
        run: bunx wrangler deploy --dry-run

      - name: Report success
        if: success()
        run: echo "All Cloudflare Worker checks passed."
